services:

  # ── FastAPI app ──────────────────────────────────────
  api:
    build: .
    container_name: semantic_api
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file: .env
    depends_on:
      - qdrant
      - redis
      - mongo
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # ── Streamlit UI ─────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: semantic_ui
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - api
    restart: unless-stopped

  # ── Celery worker ────────────────────────────────────
  worker:
    build: .
    container_name: semantic_worker
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      - redis
      - qdrant
      - mongo
    restart: unless-stopped

  # ── Qdrant (Vector DB) ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: semantic_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: semantic_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MongoDB ───────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: semantic_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  mongo_data:
