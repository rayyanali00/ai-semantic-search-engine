services:

  # ── FastAPI app ──────────────────────────────────────
  api:
    build: .
    container_name: semantic_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongo:27017
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # ── Streamlit UI ─────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: semantic_ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

  # ── Celery worker ────────────────────────────────────
  worker:
    build: .
    container_name: semantic_worker
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - MONGO_URI=mongodb://mongo:27017
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - qdrant
      - mongo
    restart: unless-stopped

  # ── Qdrant (Vector DB) ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: semantic_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: semantic_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── MongoDB ───────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: semantic_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  mongo_data:
